<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-3">
        <h3>Profile:</h3>
        <form id="profileForm">
            <label for="name" class="form-label">Username: </label><br>
            <input type="text" id="name" class="form-control"><br>

            <label for="birthYear" class="form-label">Birth Year: </label><br>
            <input type="number" id="birthYear" class="form-control"><br>

            <input type="submit" value="Create / Update Profile" class="btn btn-primary">
        </form>
    </div>
    

    <div class="container mt-5">
        <h3>Tasks:</h3>

        <input type="text" id="taskInput" placeholder="Enter a new task..." class="form-control mb-2">
        <button id="addBtn" class="btn btn-success">Add Item</button>
        <button id="removeBtn" class="btn btn-danger">Delete Item</button>

        <ul id="taskList" class="mt-3">
            <li>Study</li>
            <li>Complete asignments</li>
            <li>Cook</li>
            <li>Clean my room</li>
        </ul>
    </div>
    
    <script src="program.js"></script>
</body>
</html>
